# Push a tag like v1.2.0 to build all three apps and attach them to a GitHub Release.
name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x
      - run: dotnet test windows/SoundSwap.Tests/SoundSwap.Tests.csproj -c Release
      - run: >
          dotnet publish windows/SoundSwap/SoundSwap.csproj -c Release -r win-x64 --self-contained false
          -p:PublishSingleFile=true -o publish
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: publish/SoundSwap.exe

  android:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
      - run: ./gradlew testReleaseUnitTest assembleRelease --console=plain
      - run: cp app/build/outputs/apk/release/app-release.apk SoundSwap.apk
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/SoundSwap.apk

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build unsigned IPA
        run: |
          brew install xcodegen
          cd ios && xcodegen generate
          xcodebuild -project SoundSwap.xcodeproj -scheme SoundSwap -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/SoundSwap.app Payload/
          zip -qr SoundSwap-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: ios
          path: ios/SoundSwap-unsigned.ipa

  publish:
    needs: [windows, android, ios]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/SoundSwap.exe
            dist/SoundSwap.apk
            dist/SoundSwap-unsigned.ipa
